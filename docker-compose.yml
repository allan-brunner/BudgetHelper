services:
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: budget-db
    restart: unless-stopped
    environment:
      - SQLD_NODE=primary
    volumes:
      - sqlite_prod_data:/var/lib/sqld
    networks:
      - db_net

  backend:
    build:
      context: ./backend
      target: prod
    container_name: budget-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - APP_PIN=${APP_PIN:-1234}
      - DB_URL=http://db:8080
      - ACC1_ID=${ACC1_ID:-john}
      - ACC1_NAME=${ACC1_NAME:-John}
      - ACC2_ID=${ACC2_ID:-jane}
      - ACC2_NAME=${ACC2_NAME:-Jane}
    depends_on:
      - db
    networks:
      - db_net
      - frontend_net

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: budget-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true

volumes:
  sqlite_prod_data: